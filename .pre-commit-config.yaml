repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
          - id: check-toml

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.5
      hooks:
          - id: ruff
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.3.1
      hooks:
          - id: mypy
            # The hook's isolated env otherwise lacks hypothesis/fastapi/pytest,
            # so mypy can't type tests/test_engine.py's @rule()/@invariant(),
            # server/app.py's @app.get()/@app.post(), or tests/test_persistence.py's
            # @pytest.fixture() decorators ("Untyped decorator makes function ...
            # untyped").
            additional_dependencies: ["hypothesis>=6.167.1", "fastapi>=0.141.1", "pytest>=9.1.1"]
