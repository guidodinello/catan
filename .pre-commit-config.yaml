repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
          - id: check-toml

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.8
      hooks:
          - id: ruff
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.3.1
      hooks:
          - id: mypy
            # The hook's isolated env otherwise lacks hypothesis/fastapi/pytest,
            # so mypy can't type tests/test_engine.py's @rule()/@invariant(),
            # server/app.py's @app.get()/@app.post(), or tests/test_persistence.py's
            # @pytest.fixture() decorators ("Untyped decorator makes function ...
            # untyped"). gamekit is a real (git) dependency now, not just
            # decorator-typing stubs -- without it here, mypy can't resolve
            # agents/base.py's/experiments/*.py's `from gamekit... import`.
            additional_dependencies:
              [
                "hypothesis>=6.168.0",
                "fastapi>=0.141.1",
                "pytest>=9.1.1",
                "git+https://github.com/guidodinello/gamekit@main",
                # rl/ imports these directly; without them mypy can't resolve
                # rl/encoder.py's and rl/env.py's imports. The heavier training
                # stack (torch, sb3-contrib) is handled by ignore_missing_imports
                # overrides in pyproject.toml instead of being installed here.
                "gymnasium>=1.3.0",
                "numpy>=2.5.3",
              ]
