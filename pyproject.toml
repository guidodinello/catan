[project]
name = "catan"
version = "0.1.0"
description = "Base-game Catan rules engine and hot-seat CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
catan = "main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "hypothesis>=6.167.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
include = ["main.py", "cli.py"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["engine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
