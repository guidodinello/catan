[project]
name = "catan"
version = "0.1.0"
description = "Base-game Catan rules engine and hot-seat CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "gamekit",
    "uvicorn[standard]>=0.53.0",
]

# Split by dependency so CI never downloads a training stack. `rl` is the env
# + encoder (gymnasium/numpy, ~30MB) and is exercised by a dedicated CI job;
# `rl-train` adds the framework and is never installed in CI. gamekit's own
# pyproject draws the same line, and truco-py's flat dependency list -- where
# installing the package always pulls CUDA torch -- is the anti-pattern.
[project.optional-dependencies]
rl = [
    "gamekit[rl]",
    "gymnasium>=1.3.0",
    "numpy>=2.5.3",
]
rl-train = [
    "catan[rl]",
    "sb3-contrib>=2.9.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.20.0",
    "torch>=2.14",
]

[project.scripts]
catan = "main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "hypothesis>=6.168.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "experiments", "agents", "server", "rl"]
include = ["main.py", "cli.py"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "experiments", "agents", "server", "rl"]

[tool.uv.sources]
gamekit = { git = "https://github.com/guidodinello/gamekit", branch = "main" }
# CPU-only torch. The default Linux index pulls ~3-4GB of nvidia-*/triton
# wheels; this one pulls ~250MB and no CUDA at all. Justified empirically:
# truco-py measured on this same machine that training is CPU-bound --
# environment simulation dominates network inference -- and catan's engine is
# pure Python and heavier still. Revisit if self-play turns out bottlenecked
# on opponent-checkpoint inference.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

# The training stack is an optional extra, so type-checking must stay green
# without it installed -- same approach as gamekit's gymnasium/numpy overrides.
[[tool.mypy.overrides]]
module = ["sb3_contrib.*", "stable_baselines3.*", "torch.*", "tensorboard.*"]
ignore_missing_imports = true
