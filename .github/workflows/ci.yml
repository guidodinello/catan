# Baseline CI for a small/single-package Python repo — mirrors the pre-commit
# baseline (templates/pre-commit/python.yaml) as a required gate, since
# pre-commit itself only runs locally and CI is the only place a required
# check can actually enforce it. Deliberately just lint + test: no
# typecheck (add a "Typecheck Python" job with pyright/mypy once the repo
# has real type-annotation coverage), no path filtering (add
# dorny/paths-filter once this repo is a monorepo with independent
# subprojects — not needed for a single package).
#
# Adopt: cp to .github/workflows/ci.yml, fill in the two <FIXME> spots,
# then add "Lint Python" and "Tests (Python)" as required_status_checks
# contexts for this repo in github-standard.json.
#
# Before the first push, check the target repo actually has what this
# workflow assumes — two gaps found rolling this out the first time:
#   - `ruff`/`pytest` must be in the project's own dev dependency group.
#     A repo that only runs ruff through pre-commit's isolated hook env
#     doesn't have it on `uv sync --dev`'s PATH; CI fails with
#     "Failed to spawn: `ruff`" even though pre-commit works fine locally.
#   - ruff >=0.13 formats fenced Python code blocks inside Markdown by
#     default. `ruff format --check .` at a repo root with a docs/ folder
#     will try to reformat illustrative code snippets in prose. Add
#     `extend-exclude = ["docs"]` (or wherever non-source markdown lives)
#     under `[tool.ruff]` in pyproject.toml — fixes it for local
#     pre-commit and editors too, not just this workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default GITHUB_TOKEN scope for every job below — neither lints nor tests
# writes anything (no comments, no pushes, no packages). Least privilege.
permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

  # Advisory: audits the workflow files with zizmor. Not in the `CI` job's needs:
  # list and continue-on-error on the step, so findings never block a merge. The
  # version is pinned so a new upstream audit cannot turn this red between runs;
  # Dependabot does not bump a `uvx` pin, so bump it by hand. Make it blocking
  # (drop continue-on-error, add to needs:) once it has run clean for a few weeks.
  # GH_TOKEN is the read-only workflow token; it enables the online audits that
  # check each pinned SHA really belongs to the tagged repo.
  audit-workflows:
    name: Audit workflows (advisory)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: zizmor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --format=github .github/workflows

  test-python:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

  # Separate job so the default one never downloads a training stack. The `rl`
  # extra is gymnasium + numpy only (~30MB); `rl-train` (sb3-contrib, torch) is
  # deliberately never installed here. Without this job the tests under
  # tests/rl/ would `importorskip` themselves away in CI, and green-by-skipping
  # is not green.
  test-rl:
    name: Tests (RL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --extra rl

      - name: Run RL tests
        run: uv run pytest tests/rl

  # Single stable check name for the branch ruleset (see dev-standards
  # templates/ci/python-ci.yml). if: always() so it still runs (and fails) when a
  # needed job fails; a skipped required check would count as passing.
  ci:
    name: CI
    needs:
      - lint-python
      - test-python
      - test-rl
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -ra results <<< "$RESULTS"
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "A required job finished as: $r"
              exit 1
            fi
          done
